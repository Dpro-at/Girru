<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Not paired yet</title>
<style>
  :root { --bg: #F8F9FE; --text: #252528; --muted: #6B6E76; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1B1F27; --text: #F2F3F7; --muted: #A3A7B0; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 24px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; line-height: 1.4; }
</style>
</head>
<body>
<main>
  <h1>Not paired yet</h1>
  <p>Open Girru on your computer, then Settings › Phone, and scan the code shown there.</p>
</main>
</body>
</html>
