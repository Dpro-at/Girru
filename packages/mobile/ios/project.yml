# XcodeGen spec for the Girru iOS app. The .xcodeproj is generated from this
# file and never committed (see README "Generate the project").
name: Girru

options:
  bundleIdPrefix: dev.girru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Placeholders until Mohamed confirms them (README "Open decisions").
    GIRRU_BUNDLE_ID: dev.girru.app
    GIRRU_KEYCHAIN_GROUP: dev.girru.shared
    # Set locally (Xcode › Signing) or with DEVELOPMENT_TEAM=… on the command
    # line; never committed.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Girru:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
      - Lock
      - Pairing
      - Push
      - Storage
      # NotPaired.html is copied as a bundle resource (XcodeGen default for .html).
      - Web
      - Sources/GirruCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GIRRU_BUNDLE_ID)
        PRODUCT_NAME: Girru
        # The Girru mark, same as the desktop app icon (App/Assets.xcassets).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Girru.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: GirruNotificationService
        embed: true

  GirruNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - Info.plist
          - "*.entitlements"
      - Sources/GirruCore
      - Storage/KeychainStore.swift
      - Storage/PairingStore.swift
      - Push/NoticeCategory.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GIRRU_BUNDLE_ID).notifications
        PRODUCT_NAME: GirruNotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"

schemes:
  Girru:
    build:
      targets:
        Girru: all
    run:
      config: Debug
