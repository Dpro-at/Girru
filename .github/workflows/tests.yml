name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check and test suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      npm_config_fund: 'false'
      npm_config_audit: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install locked dependencies
        run: |
          npm ci --prefix packages/backend
          npm ci --prefix packages/core-ui
          npm ci --prefix packages/desktop
      # The application-server and desktop-integration tests serve a verified UI build.
      - name: Build verified UI
        run: |
          node packages/core-ui/scripts/build.cjs
          node packages/core-ui/scripts/build.cjs --candidate --live-entry
      - name: Type-check
        run: |
          node --test scripts/dependency-snapshot.test.cjs
          node packages/core-ui/scripts/typecheck.cjs
          (cd packages/backend && npx tsc --noEmit -p .)
      # Some tests start node with paths relative to their package, so each suite runs from it.
      - name: UI tests
        working-directory: packages/core-ui
        run: node --import ../../scripts/test-temp-root.mjs --test --test-concurrency=2 --test-timeout=90000 tests/*.test.cjs
      - name: Desktop tests
        working-directory: packages/desktop
        run: node --import ../../scripts/test-temp-root.mjs --test --test-timeout=90000 test/*.test.cjs
      # lmstudio.test.mjs needs a running LM Studio; PostgreSQL tests skip without AGENT_PLAYER_PG_TEST_URL.
      # Temp folders like a desktop's: two levels deep (tests work from them and the legacy memory store
      # resolves ../../.data), outside the home folder (isolated data roots must be) and not under a folder
      # named tmp (discovery never reads one). scripts/test-temp-root.mjs gives each test process its own
      # root inside it and removes the root when the process ends.
      - name: Backend tests
        working-directory: packages/backend
        run: |
          sudo install -d -m 755 -o "$(id -u)" -g "$(id -g)" /srv/girru /srv/girru/scratch
          export TMPDIR=/srv/girru/scratch
          node --import tsx --import ../../scripts/test-temp-root.mjs --test --test-concurrency=4 --test-timeout=120000 $(ls test/*.test.mjs | grep -v '/lmstudio\.test\.mjs$')

  desktop-portability:
    name: Desktop portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install packaging dependencies without launching Electron
        run: npm ci --ignore-scripts --prefix packages/desktop
      - name: Test packaging, runtime staging and process lifecycle
        shell: bash
        run: node --import ./scripts/test-temp-root.mjs --test --test-timeout=90000 packages/desktop/test/build-dependencies.test.cjs packages/desktop/test/stage-nabu.test.cjs packages/desktop/test/lifecycle.test.cjs packages/desktop/test/permissions.test.cjs packages/desktop/test/desktop-notifications.test.cjs packages/desktop/test/system-tray.test.cjs
