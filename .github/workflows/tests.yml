name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Every pull request, whatever it targets: a stacked PR (one that merges into another branch
  # before main) used to get no checks at all, so its code reached main having never been tested
  # as a unit. `push` stays limited to main, so a branch is tested through its PR, not twice.
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and smoke-test Girru in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and wait for the backend
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check the live interface and locked native modules
        run: |
          curl -fsS http://127.0.0.1:41522/api/health | jq -e '.status == "ok"'
          curl -fsS http://127.0.0.1:41522/api/setup/status | jq -e '.setupRequired'
          curl -fsS http://127.0.0.1:41522/ | grep -F 'content="live-candidate"'
          docker compose exec -T backend node -e '
            const assert = require("node:assert/strict");
            const lock = require("./package-lock.json").packages;
            for (const name of Object.keys(require("./package.json").dependencies)) {
              assert.equal(require("./node_modules/" + name + "/package.json").version, lock["node_modules/" + name].version);
            }
            const db = require("better-sqlite3")(":memory:");
            assert.equal(db.prepare("SELECT 42 AS n").get().n, 42);
            db.close();
            const { Index } = require("usearch");
            const index = new Index({ dimensions: 2, metric: "cos", quantization: "f32" });
            index.add(1n, new Float32Array([1, 0]));
            assert.equal(index.search(new Float32Array([1, 0]), 1).keys[0], 1n);'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 80 backend
      - name: Stop the test service
        if: always()
        run: docker compose down --volumes
  test:
    name: Type-check and test suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A throwaway PostgreSQL for the memory-encryption driver tests (loopback only, test database name).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: girru
          POSTGRES_PASSWORD: girru-ci-only
          POSTGRES_DB: girru_enc_final_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U girru -d girru_enc_final_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      npm_config_fund: 'false'
      npm_config_audit: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install locked dependencies
        run: |
          npm ci --prefix packages/backend
          npm ci --prefix packages/core-ui
          npm ci --prefix packages/desktop
      # The application-server and desktop-integration tests serve a verified UI build.
      - name: Build verified UI
        run: |
          node packages/core-ui/scripts/build.cjs
          node packages/core-ui/scripts/build.cjs --candidate --live-entry
      - name: Type-check
        run: |
          node --test scripts/dependency-snapshot.test.cjs
          node packages/core-ui/scripts/typecheck.cjs
          (cd packages/backend && npx tsc --noEmit -p .)
      # Some tests start node with paths relative to their package, so each suite runs from it.
      - name: UI tests
        working-directory: packages/core-ui
        run: node --import ../../scripts/test-temp-root.mjs --test --test-concurrency=2 --test-timeout=90000 tests/*.test.cjs
      - name: Desktop tests
        working-directory: packages/desktop
        run: node --import ../../scripts/test-temp-root.mjs --test --test-timeout=90000 test/*.test.cjs
      # lmstudio.test.mjs needs a running LM Studio; PostgreSQL tests skip without AGENT_PLAYER_PG_TEST_URL.
      # Temp folders like a desktop's: two levels deep (tests work from them and the legacy memory store
      # resolves ../../.data), outside the home folder (isolated data roots must be) and not under a folder
      # named tmp (discovery never reads one). scripts/test-temp-root.mjs gives each test process its own
      # root inside it and removes the root when the process ends.
      - name: Backend tests
        working-directory: packages/backend
        run: |
          sudo install -d -m 755 -o "$(id -u)" -g "$(id -g)" /srv/girru /srv/girru/scratch
          export TMPDIR=/srv/girru/scratch
          # Memory-encryption tests need their own synthetic root (scripts/enc-test-root.mjs) and run below;
          # the account tests start three Girru processes each and run one file at a time below.
          ENC=$(grep -lE "fixtures/memory-encryption|DPRO_ENC_TEST_ROOT" test/*.test.mjs)
          ACCOUNT=$(grep -l "fixtures/dpro-harness" test/*.test.mjs)
          node --import tsx --import ../../scripts/test-temp-root.mjs --test --test-concurrency=4 --test-timeout=120000 $(ls test/*.test.mjs | grep -v '/lmstudio\.test\.mjs$' | grep -vxF -e "$ENC" -e "$ACCOUNT")

      - name: Backend memory-encryption tests (SQLite and PostgreSQL)
        working-directory: packages/backend
        env:
          DPRO_ENC_PG_URL: postgres://girru:girru-ci-only@127.0.0.1:5432/girru_enc_final_ci
        run: |
          export TMPDIR=/srv/girru/scratch
          node --import tsx --import ../../scripts/test-temp-root.mjs --import ../../scripts/enc-test-root.mjs --test --test-concurrency=2 --test-timeout=120000 $(grep -lE "fixtures/memory-encryption|DPRO_ENC_TEST_ROOT" test/*.test.mjs)

      - name: Backend account tests (one file at a time)
        working-directory: packages/backend
        run: |
          export TMPDIR=/srv/girru/scratch
          node --import tsx --import ../../scripts/test-temp-root.mjs --test --test-concurrency=1 --test-timeout=180000 $(grep -l "fixtures/dpro-harness" test/*.test.mjs)

  desktop-portability:
    name: Desktop portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install packaging dependencies without launching Electron
        run: npm ci --ignore-scripts --prefix packages/desktop
      - name: Test packaging, runtime staging and process lifecycle
        shell: bash
        run: node --import ./scripts/test-temp-root.mjs --test --test-timeout=90000 packages/desktop/test/build-dependencies.test.cjs packages/desktop/test/bundle-inputs.test.cjs packages/desktop/test/code-runtime.test.cjs packages/desktop/test/stage-nabu.test.cjs packages/desktop/test/lifecycle.test.cjs packages/desktop/test/permissions.test.cjs packages/desktop/test/desktop-notifications.test.cjs packages/desktop/test/system-tray.test.cjs

      - name: Test isolated filesystem reads without application dependencies
        run: node --experimental-transform-types --import ./scripts/test-temp-root.mjs --test --test-timeout=90000 packages/backend/test/discovery-fs.test.mjs

      - name: Test first-run discovery and local import on desktop platforms
        shell: bash
        run: |
          npm ci --prefix packages/backend
          cd packages/backend
          node --import tsx --import ../../scripts/test-temp-root.mjs --test --test-timeout=90000 test/first-run-steps.test.mjs test/replace-discovery-file.test.mjs test/local-agent-import.test.mjs test/chat-reply-rounds.test.mjs test/sync-directory.test.mjs test/safe-file.test.mjs test/subscription-launcher-win.test.mjs test/terminal-command-native.test.mjs
          node --test --test-timeout=90000 ../desktop/test/payload-runtime.test.cjs

      - name: Repeat Windows first-run checkpoint replacement
        if: runner.os == 'Windows'
        shell: bash
        working-directory: packages/backend
        run: |
          for attempt in {1..10}; do
            node --import tsx --import ../../scripts/test-temp-root.mjs --test --test-timeout=90000 test/first-run-steps.test.mjs
          done
