services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:41522:41522"
    environment:
      - JWT_SECRET
      - ENCRYPTION_KEY
      - OLLAMA_URL
    volumes:
      - data-storage:/app/.data
      - public-storage:/app/public/storage
    init: true
    restart: unless-stopped
    stop_grace_period: 25s

volumes:
  data-storage:
    name: ${GIRRU_DATA_VOLUME:-agent-player-data}
  public-storage:
    name: ${GIRRU_STORAGE_VOLUME:-agent-player-public}
